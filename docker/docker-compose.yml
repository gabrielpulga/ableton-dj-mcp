name: ableton-dj-mcp

services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../:/app
      - node_modules:/app/node_modules
    command: npm run dev

  check:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: npm run check

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: npm test

  build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: npm run build

volumes:
  node_modules:
